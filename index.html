<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أدوات الخميس للسفر والسياحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0e2a47; --blue:#0056b3; --sky:#e6eef7; --line:#cdd8e4;
    --bg:#f3f6fa; --paper:#fff; --muted:#5a6b7d; --amber:#c98a1b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.6}
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px 56px}
  header{margin-bottom:28px;padding-bottom:18px;border-bottom:3px solid var(--navy)}
  header p{margin:0;color:var(--muted);font-size:15px}
  h1{margin:0 0 4px;font-size:34px;font-weight:800;line-height:1.25}
  nav{display:grid;gap:12px}
  a.tool{
    display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;
    background:var(--paper);border:1px solid var(--line);border-inline-start:6px solid var(--blue);
    border-radius:8px;padding:18px 20px;color:inherit;text-decoration:none;
    transition:background .15s,border-color .15s
  }
  a.tool:hover{background:var(--sky);border-inline-start-color:var(--amber)}
  a.tool:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .ic{font-size:34px;line-height:1;text-align:center}
  .tool h2{margin:0;font-size:20px;font-weight:800}
  .tool p{margin:2px 0 0;font-size:14px;color:var(--muted)}
  .go{font-weight:600;color:var(--blue);font-size:15px;white-space:nowrap}
  @media(max-width:520px){
    h1{font-size:27px}
    a.tool{grid-template-columns:44px 1fr;padding:16px}
    .go{display:none}
    .ic{font-size:28px}
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>أدوات الخميس</h1>
    <p>شركة خميس للسفر والسياحة. اختار الأداة اللي عايزها.</p>
  </header>
  <nav>
    <a class="tool" href="voucher/">
      <span class="ic">🧾</span>
      <span><h2>فاوتشر الحجز</h2><p>تجهيز وطباعة فاوتشر الخميس للسفر</p></span>
      <span class="go">افتح الأداة</span>
    </a>
    <a class="tool" href="amadeus/">
      <span class="ic">✈️</span>
      <span><h2>محول Amadeus</h2><p>تحويل بيانات الحجز من Amadeus لرسالة جاهزة</p></span>
      <span class="go">افتح الأداة</span>
    </a>
    <a class="tool" href="hotel-form/">
      <span class="ic">🏨</span>
      <span><h2>نموذج حجز فندق</h2><p>تأكيد حجز فندق جاهز للطباعة أو النسخ للواتساب</p></span>
      <span class="go">افتح الأداة</span>
    </a>
  </nav>
</main>
</body>
</html>
