<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amadeus Converter Ultimate</title>
  <style>
    body{
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      background-color:#f4f7f6;
      color:#333;margin:0;display:flex;justify-content:center;align-items:center;
      min-height:100vh;direction:ltr;text-align:left;line-height:1.6;
    }
    .login-container{
      max-width:400px;width:90%;background:#fff;padding:40px;border-radius:8px;
      box-shadow:0 4px 20px rgba(0,0,0,.15);display:block;
    }
    .login-container h1{color:#2c3e50;text-align:center;margin-bottom:30px;}
    .login-container input{
      width:100%;padding:12px;margin-bottom:15px;border:1px solid #ddd;border-radius:5px;
      box-sizing:border-box;
    }
    .login-container button{
      background:#007bff;color:#fff;padding:12px 25px;border:none;border-radius:5px;width:100%;
      cursor:pointer;font-size:16px;
    }
    .login-container button:hover{background:#0056b3;}
    .message{margin-top:20px;padding:10px;border-radius:5px;text-align:center;display:none;}
    .message.error{background:#ffeaea;color:#dc3545;}
    .message.success{background:#e6ffe6;color:#28a745;}

    .converter-container{
      max-width:900px;width:90%;margin:40px auto;background:#fff;padding:30px;border-radius:8px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);display:none;direction:ltr;
    }
    .converter-container h1{color:#2c3e50;text-align:center;margin-bottom:30px;}
    .converter-container textarea{
      width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:16px;
      box-sizing:border-box;min-height:110px;resize:vertical;
    }
    .button-group{display:flex;justify-content:center;gap:15px;margin-top:30px;}
    .converter-container button{
      background:#007bff;color:#fff;padding:10px 20px;border:none;border-radius:5px;
      cursor:pointer;font-size:16px;
    }
    .converter-container button.clear-button{background:#6c757d;}
    .converter-container button.copy-button{background:#28a745;}

    .options-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px;direction:rtl;}
    .options-row > div{flex:1;min-width:140px;}
    .options-row label{display:block;font-size:14px;font-weight:bold;margin-bottom:5px;}
    .options-row select,.options-row input{
      width:100%;padding:8px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;font-size:15px;
    }

    .trip-label{direction:rtl;text-align:right;margin:14px 0 6px;font-size:16px;color:#0d47a1;}
    .flight-segment{
      background:#f9f9f9;border:1px solid #e0e0e0;border-radius:6px;padding:10px 14px;margin-bottom:8px;
      box-shadow:0 2px 4px rgba(0,0,0,.05);line-height:1.6;direction:rtl;font-size:15px;text-align:right;
    }
    .flight-segment p{margin:2px 0;}
    .extra-box{direction:rtl;text-align:right;margin:8px 0;font-size:15px;}
    .extra-box p{margin:2px 0;}
    .line-error{
      background:#fff0f0;border:1px solid #ffcccc;color:#b00020;border-radius:6px;padding:12px 15px;margin-bottom:10px;
      direction:rtl;text-align:right;font-size:15px;
    }
    .transit-box{
      background:#e3f2fd;color:#0d47a1;padding:8px 15px;margin-bottom:10px;border-radius:20px;
      text-align:center;font-weight:bold;font-size:.9em;direction:rtl;border:1px dashed #90caf9;width:fit-content;
      margin-left:auto;margin-right:auto;
    }
    .transit-box.warning{background:#ffebee;color:#c62828;border-color:#ef9a9a;}
    .disclaimer-box{
      background:#fff3cd;border:1px solid #ffeeba;color:#856404;padding:8px 12px;border-radius:6px;margin-top:12px;
      direction:rtl;text-align:right;font-size:.9em;
    }
    #resultsOutput[contenteditable="true"]{outline:none;}
    #resultsOutput[contenteditable="true"]:focus{background:#fffef8;}
    .copy-feedback{text-align:center;color:#28a745;margin-top:10px;font-weight:bold;opacity:0;transition:opacity .3s;}
    .copy-feedback.show{opacity:1;}

</head>

    // ---------------- Helpers ----------------
    function getDayName(d){ return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()]; }
    function getMonthName(m){ return {'JAN':'يناير','FEB':'فبراير','MAR':'مارس','APR':'أبريل','MAY':'مايو','JUN':'يونيو','JUL':'يوليو','AUG':'أغسطس','SEP':'سبتمبر','OCT':'أكتوبر','NOV':'نوفمبر','DEC':'ديسمبر'}[m] || m; }
    function getMonthNumber(c){ return {'JAN':0,'FEB':1,'MAR':2,'APR':3,'MAY':4,'JUN':5,'JUL':6,'AUG':7,'SEP':8,'OCT':9,'NOV':10,'DEC':11}[c]; }
    function getMonthCode(n){ return ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][n]; }

    // اسم مختصر للمطار (من غير الدولة وكلمة الدولي)
    function shortName(n){
      return String(n).replace(/\s*\(.*?\)\s*/g,' ').replace('الدولي','').replace(/\s+/g,' ').trim();
    }

    // الدولة من آخر قوس في اسم المطار (للتفرقة بين داخلي ودولي)
    function countryOf(name){
      const m = String(name).match(/\(([^()]*)\)\s*$/);
      if(!m) return null;
      const parts = m[1].split('،');
      return parts[parts.length-1].trim();
    }

    // شركات الطيران الاقتصادي: غالباً بدون شنطة مشحونة (تقديري، راجع الفير)
    const LCC = new Set(['G9','J9','XY','FZ','FR','W6','U2','VY','TR','AK','D7','PC','NK','F9']);

    function baggageText(airlineCode, choice){
      let checked;
      if(choice === 'auto') checked = LCC.has(airlineCode) ? '' : '23 كيلو';
      else if(choice === 'none') checked = '';
      else if(choice === '2x23') checked = '2 × 23 كيلو';
      else checked = choice + ' كيلو';
      return checked
        ? `🧳 7 كيلو شنطة يد + ${checked}`
        : `🧳 7 كيلو شنطة يد فقط`;
    }

    // ✅ Supports "1100" and "1100+1"
    function parseTimeToken(token){
      const m = String(token).match(/^(\d{4})(?:\+(\d+))?$/);
      if(!m) return null;
      const t = m[1];
      const hh = parseInt(t.slice(0,2),10);
      const mm = parseInt(t.slice(2),10);
      if(hh<0 || hh>23 || mm<0 || mm>59) return null;
      return { time: t, dayAdd: m[2] ? parseInt(m[2],10) : 0 };
    }

    function formatTime12Hour(time24){
      if(!time24 || !/^\d{4}$/.test(time24)) return '';
      let h = parseInt(time24.slice(0,2),10);
      const m = time24.slice(2);
      const ampm = h>=12 ? 'م' : 'ص';
      h = h%12 || 12;
      return `${h}:${m} ${ampm}`;
    }

    function parseSegment(str){
      const res = { raw: str };
      const parts = str.trim().split(/\s+/);
      if(parts.length < 5){ res.error=true; res.errorMsg="صيغة السطر غير كافية"; return res; }

      let airlineCode="", flightNo="", datePart="", route="", routeIdx=-1;
      const times = [];

      // airline & flight
      if(/^[A-Z]{2}\d{3,4}$/i.test(parts[1])){
        airlineCode = parts[1].substring(0,2).toUpperCase();
        flightNo = parts[1].substring(2);
      } else {
        airlineCode = (parts[1]||"").toUpperCase();
        flightNo = (parts[2]||"");
      }

      parts.forEach((p, idx) => {
        if(/\d{2}[A-Z]{3}/i.test(p) && !datePart) datePart = p.toUpperCase();
        if(!route && /^(?:[0-9]+\*)?([A-Z]{6})$/i.test(p)){
          route = p.match(/([A-Z]{6})$/i)[1].toUpperCase();
          routeIdx = idx;
        }
      });

      // الأوقات بتتقرا من بعد المسار بس (عشان رقم رحلة من 4 أرقام ميتفهمش كوقت)
      if(routeIdx >= 0){
        for(let i = routeIdx + 1; i < parts.length; i++){
          const tp = parseTimeToken(parts[i]);
          if(tp) times.push(tp);
        }
      }

      if(!datePart || !route || times.length < 2){
        res.error=true; res.errorMsg="لم يتم العثور على (التاريخ/المسار/الوقت) بشكل صحيح";
        return res;
      }

      res.airlineCode = airlineCode;
      res.flightNo = flightNo;
      res.airline = airlines[airlineCode] || airlineCode;

      res.origin = route.slice(0,3);
      res.dest   = route.slice(3,6);
      res.originName = airports[res.origin] || res.origin;
      res.destName   = airports[res.dest] || res.dest;

      // أكواد غير معروفة
      res.unknown = [];
      if(!airlines[airlineCode]) res.unknown.push('شركة طيران: ' + airlineCode);
      if(!airports[res.origin]) res.unknown.push('مطار: ' + res.origin);
      if(!airports[res.dest])   res.unknown.push('مطار: ' + res.dest);

      const depT = times[0];
      const arrT = times[1];

      res.depTime = depT.time;
      res.arrTime = arrT.time;
      res.arrDayAdd = arrT.dayAdd || 0;

      const day = parseInt(datePart.slice(0,2),10);
      const mon = datePart.slice(2,5);
      const monthNum = getMonthNumber(mon);
      if(monthNum === undefined){
        res.error=true; res.errorMsg="كود الشهر غير معروف: "+mon;
        return res;
      }

      let year = new Date().getFullYear();
      const today = new Date(); today.setHours(0,0,0,0);
      const depDateOnly = new Date(year, monthNum, day); depDateOnly.setHours(0,0,0,0);
      if(depDateOnly < today) year++;

      res.depDateObj = new Date(
        year, monthNum, day,
        parseInt(res.depTime.slice(0,2),10),
        parseInt(res.depTime.slice(2),10)
      );

      res.arrDateObj = new Date(
        year, monthNum, day,
        parseInt(res.arrTime.slice(0,2),10),
        parseInt(res.arrTime.slice(2),10)
      );

      if(res.arrDayAdd > 0){
        res.arrDateObj.setDate(res.arrDateObj.getDate() + res.arrDayAdd);
      } else if(res.arrDateObj < res.depDateObj){
        res.arrDateObj.setDate(res.arrDateObj.getDate() + 1);
      }

      res.fmtDep  = `${getDayName(res.depDateObj)} ${day} ${getMonthName(mon)} ${year}`;
      res.fmtArr  = `${getDayName(res.arrDateObj)} ${res.arrDateObj.getDate()} ${getMonthName(getMonthCode(res.arrDateObj.getMonth()))} ${res.arrDateObj.getFullYear()}`;
      res.fmtDepT = formatTime12Hour(res.depTime);
      res.fmtArrT = formatTime12Hour(res.arrTime);

      return res;
    }

    // تقسيم الرحلات: أي فاصل 24 ساعة أو أكتر = رحلة جديدة
    function groupTrips(segs){
      const groups = [[segs[0]]];
      for(let i=1;i<segs.length;i++){
        const gap = segs[i].depDateObj - segs[i-1].arrDateObj;
        if(gap >= 86400000) groups.push([segs[i]]);
        else groups[groups.length-1].push(segs[i]);
      }
      return groups;
    }

    function tripLabels(groups, segs){
      if(groups.length === 1) return [''];
      const roundTrip = groups.length === 2 && segs[segs.length-1].dest === segs[0].origin;
      if(roundTrip) return ['رحلة الذهاب','رحلة العودة'];
      return groups.map((_, i) => `الرحلة ${i+1}`);
    }

    // فرق الأيام بين المغادرة والوصول
    function dayDiff(a, b){
      const d1 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
      const d2 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.round((d2 - d1) / 86400000);
    }

    // العرض المختصر: كارت واحد لكل رحلة
    function compactTrip(g, bagChoice){
      const sameAir = g.every(s => s.airlineCode === g[0].airlineCode);
      let rows = '';
      if(sameAir) rows += `<p>✈️ <strong>${g[0].airline}</strong></p>`;

      let lastDate = '';
      g.forEach((s, i) => {
        if(i > 0){
          const prev = g[i-1];
          if(prev.dest === s.origin){
            const diffMs = s.depDateObj - prev.arrDateObj;
            if(diffMs > 0 && diffMs < 86400000){
              const h = Math.floor(diffMs/3600000);
              const m = Math.round((diffMs%3600000)/60000);
              rows += `<p>⏳ انتظار ${h} س ${m} د في ${shortName(s.originName)}</p>`;
            }
          }
        }

        const dateShort = `${getDayName(s.depDateObj)} ${s.depDateObj.getDate()} ${getMonthName(getMonthCode(s.depDateObj.getMonth()))}`;
        const showDate = dateShort !== lastDate;
        lastDate = dateShort;

        const dd = dayDiff(s.depDateObj, s.arrDateObj);
        const next = dd > 0 ? ` (+${dd})` : '';
        const head = sameAir ? '' : `<strong>${s.airline}</strong> | `;

        rows += `<p>${sameAir ? '🛫' : '✈️'} ${head}${shortName(s.originName)} ← ${shortName(s.destName)}${showDate ? ' | ' + dateShort : ''} | ${s.fmtDepT} ← ${s.fmtArrT}${next}</p>`;
      });

      // الشنطة: مرة واحدة لو واحدة لكل القطع
      const texts = g.map(s => baggageText(s.airlineCode, bagChoice));
      if(texts.every(t => t === texts[0])){
        rows += `<p>${texts[0]}</p>`;
      } else {
        g.forEach((s, i) => {
          rows += `<p>🧳 ${s.origin}←${s.dest}: ${texts[i].replace('🧳 ','')}</p>`;
        });
      }

      return `<div class="flight-segment">${rows}</div>`;
    }

    // ---------------- Convert ----------------
    document.getElementById('convertButton').addEventListener('click', () => {
      const lines = document.getElementById('amadeusSegments').value
        .split('\n').map(l => l.trim()).filter(Boolean);

      const output = document.getElementById('resultsOutput');
      output.innerHTML = '';

      if(!lines.length){
        output.innerHTML = '<p style="text-align:center">Please enter segments.</p>';
        return;
      }

      const parsed = lines.map(parseSegment);
      const segments = parsed.filter(x => !x.error);
      const errors   = parsed.filter(x => x.error);

      let html = '';

      // العناصر اللي عليها nocopy مبتتنسخش
      if(errors.length){
        html += `<div class="line-error nocopy"><strong>⚠️ بعض السطور لم يتم قراءتها:</strong><br>`;
        errors.forEach(e=>{
          html += `• ${e.errorMsg || "خطأ غير معروف"}<br><span style="opacity:.9">(${e.raw})</span><br><br>`;
        });
        html += `</div>`;
      }

      if(!segments.length){
        html += '<p style="text-align:center;color:#b00020;font-weight:bold;">لا يوجد Segments صحيحة للتحويل.</p>';
        output.innerHTML = html;
        return;
      }

      // تحذير الأكواد غير المعروفة
      const unknown = [...new Set(segments.flatMap(s => s.unknown || []))];
      if(unknown.length){
        html += `<div class="line-error nocopy"><strong>⚠️ كود غير معروف (ضيفه في القاعدة):</strong><br>${unknown.join('<br>')}</div>`;
      }

      const bagChoice = document.getElementById('baggageSelect').value;
      const viewMode = document.getElementById('viewMode').value;
      const pax   = document.getElementById('paxInput').value.trim();
      const price = document.getElementById('priceInput').value.trim();

      const groups = groupTrips(segments);
      const labels = tripLabels(groups, segments);

      groups.forEach((g, gi) => {
        if(labels[gi]) html += `<div class="trip-label"><strong>${labels[gi]}</strong></div>`;

        if(viewMode === 'compact'){
          html += compactTrip(g, bagChoice);
          return;
        }

        g.forEach((s, i) => {
          // انتظار قصير (أقل من 24 ساعة، نفس المطار)
          if(i>0){
            const prev = g[i-1];
            if(prev.dest === s.origin){
              const diffMs = s.depDateObj - prev.arrDateObj;
              if(diffMs > 0 && diffMs < 86400000){
                const h = Math.floor(diffMs/3600000);
                const m = Math.round((diffMs%3600000)/60000);
                html += `<div class="transit-box ${h < 2 ? 'warning' : ''}">⏳ انتظار ${h} س ${m} د في ${shortName(s.originName)}</div>`;
              }
            }
          }

          const sameDay = s.depDateObj.toDateString() === s.arrDateObj.toDateString();
          const arrExtra = sameDay ? '' : ` (${s.fmtArr})`;

          html += `
            <div class="flight-segment">
              <p>✈️ <strong>${s.airline}</strong></p>
              <p>🛫 ${shortName(s.originName)} (${s.origin}) ← ${shortName(s.destName)} (${s.dest})</p>
              <p>📅 ${s.fmtDep}</p>
              <p>🕒 ${s.fmtDepT} ← ${s.fmtArrT}${arrExtra}</p>
              <p>${baggageText(s.airlineCode, bagChoice)}</p>
            </div>
          `;
        });
      });

      // الركاب والسعر (لو اتكتبوا)
      if(pax || price){
        html += `<div class="extra-box">`;
        if(pax)   html += `<p>👥 <strong>عدد الركاب:</strong> ${pax}</p>`;
        if(price) html += `<p>💰 <strong>السعر:</strong> ${price}</p>`;
        html += `</div>`;
      }

      // الحضور: ساعتين لو كل الرحلات داخلية، 3 ساعات لو في أي رحلة دولية
      const allDomestic = segments.every(s => {
        const a = countryOf(s.originName), b = countryOf(s.destName);
        return a && b && a === b;
      });
      const arriveBefore = allDomestic ? 'ساعتين' : '3 ساعات';

      html += `
        <div class="disclaimer-box">
          ⚠️ السعر غير ثابت لحين الحجز • الحضور قبل الرحلة بـ ${arriveBefore} • غير قابل للتعديل أو الاسترداد
        </div>
      `;

      output.innerHTML = html;
    });

    // ---------------- Clear / Copy ----------------
    document.getElementById('clearInputButton').onclick = () => {
      document.getElementById('amadeusSegments').value = '';
    };
    document.getElementById('clearResultsButton').onclick = () => {
      document.getElementById('resultsOutput').innerHTML = '<p style="text-align:center;color:#888">Results here...</p>';
    };

    function textWithStars(el, star){
      const c = el.cloneNode(true);
      if(star) c.querySelectorAll('strong,b').forEach(s => { s.textContent = '*' + s.textContent.trim() + '*'; });
      return c.textContent.replace(/[ \t]+\n/g,'\n').trim();
    }

    function buildText(star){
      const out = document.getElementById('resultsOutput');
      const blocks = [];
      Array.from(out.children).forEach(el => {
        if(el.classList.contains('nocopy')) return;
        const ps = el.querySelectorAll(':scope > p');
        if(ps.length){
          blocks.push(Array.from(ps).map(p => textWithStars(p, star)).filter(Boolean).join('\n'));
        } else {
          const t = textWithStars(el, star);
          if(t) blocks.push(t);
        }
      });
      return blocks.join('\n\n');
    }

    function copyOut(star, label){
      const out = document.getElementById('resultsOutput');
      if(!out.querySelector('.flight-segment')) return;
      navigator.clipboard.writeText(buildText(star)).then(() => {
        const fb = document.getElementById('copyFeedback');
        fb.textContent = label;
        fb.classList.add('show');
        setTimeout(() => fb.classList.remove('show'), 2000);
      });
    }

    document.getElementById('copyResultsButton').onclick = () => copyOut(false, 'Copied!');
    document.getElementById('copyWaButton').onclick = () => copyOut(true, 'Copied for WhatsApp!');
  </script>

</body>
</html>
